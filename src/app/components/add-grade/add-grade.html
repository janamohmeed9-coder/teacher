<form>

  <div class="row">

    <div class="form-group">

<select
  [(ngModel)]="selectedClass"
  name="class"
  (change)="loadStudents()">

  <option [ngValue]="null">Select Class</option>

  <option
    *ngFor="let item of classes"
    [ngValue]="item">

    {{ item.className }}

  </option>

</select>

    </div>

    <div class="form-group">

      <label>Student</label>

      <select
        [(ngModel)]="selectedStudent"
        name="student">

        <option [ngValue]="null">
          Select Student
        </option>

        <option
          *ngFor="let student of filteredStudents"
          [ngValue]="student">

          {{ student.firstname }} {{ student.lastName }}

        </option>

      </select>

    </div>

  </div>

  <div class="row">

    <div class="form-group">

      <label>Max Grade</label>

      <input
        type="number"
        [(ngModel)]="grade.maxGrade"
        name="maxGrade"
        placeholder="Enter Max Grade">

    </div>

    <div class="form-group">

      <label>Student Grade</label>

      <input
        type="number"
        [(ngModel)]="grade.studentGrade"
        name="studentGrade"
        placeholder="Enter Student Grade">

    </div>

  </div>

  <div class="buttons">

    <button
      type="button"
      class="cancel"
      routerLink="/grade">

      Cancel

    </button>

    <button
      type="button"
      class="done"
      (click)="saveGrade()">

      ✓ Done

    </button>

  </div>

</form>
